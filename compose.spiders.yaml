services:
  api:
    environment:
      PYTHONPATH: /app/src
    volumes:
      # Keep crawler packages in sync with the host. Mounting only spiders/
      # + services/ caused ImportError when core/ (e.g. exceptions) changed
      # but the image was stale.
      - ./src/scout_api/modules/crawler/core:/app/src/scout_api/modules/crawler/core:ro
      - ./src/scout_api/modules/crawler/spiders:/app/src/scout_api/modules/crawler/spiders:ro
      - ./src/scout_api/modules/crawler/services:/app/src/scout_api/modules/crawler/services:ro
      - ./src/scout_api/modules/crawler/models:/app/src/scout_api/modules/crawler/models:ro
      - ./src/scout_api/modules/matching:/app/src/scout_api/modules/matching:ro
    command:
      - uvicorn
      - scout_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src/scout_api/modules/crawler/core
      - --reload-dir
      - /app/src/scout_api/modules/crawler/spiders
      - --reload-dir
      - /app/src/scout_api/modules/crawler/services
      - --reload-dir
      - /app/src/scout_api/modules/crawler/models
      - --reload-dir
      - /app/src/scout_api/modules/matching
