services:
  api:
    build:
      context: .
    environment:
      APP_NAME: ${APP_NAME:-ScoutApiV2}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      HOST: 0.0.0.0
      PORT: 8000
      REDIS_URL: redis://redis:6379/0
      REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-0.3}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-0.5}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://scout:scout@postgres:5432/scoutapi}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-30000}
      DATABASE_APPLICATION_NAME: ${DATABASE_APPLICATION_NAME:-scout-api-v2}
      SCRAPE_URL_COOLDOWN_SECONDS: ${SCRAPE_URL_COOLDOWN_SECONDS:-300}
      SCRAPE_DOMAIN_MIN_INTERVAL_SECONDS: ${SCRAPE_DOMAIN_MIN_INTERVAL_SECONDS:-15}
      SCRAPE_RESULT_CACHE_TTL_SECONDS: ${SCRAPE_RESULT_CACHE_TTL_SECONDS:-300}
      SCRAPE_DISTRIBUTED_LOCK_ENABLED: ${SCRAPE_DISTRIBUTED_LOCK_ENABLED:-true}
      SCRAPE_SINGLE_FLIGHT_LOCK_TTL_SECONDS: ${SCRAPE_SINGLE_FLIGHT_LOCK_TTL_SECONDS:-180}
      SCRAPE_SINGLE_FLIGHT_WAIT_SECONDS: ${SCRAPE_SINGLE_FLIGHT_WAIT_SECONDS:-120}
      SCRAPE_DISTRIBUTED_COOLDOWN_ENABLED: ${SCRAPE_DISTRIBUTED_COOLDOWN_ENABLED:-true}
      CAMOUFOX_ENABLED: ${CAMOUFOX_ENABLED:-true}
      CAMOUFOX_HEADLESS: ${CAMOUFOX_HEADLESS:-true}
      CAMOUFOX_HUMANIZE: ${CAMOUFOX_HUMANIZE:-true}
      CAMOUFOX_TIMEOUT_MS: ${CAMOUFOX_TIMEOUT_MS:-90000}
      CAMOUFOX_SETTLE_MS: ${CAMOUFOX_SETTLE_MS:-5000}
      CAMOUFOX_MAX_SETTLE_ATTEMPTS: ${CAMOUFOX_MAX_SETTLE_ATTEMPTS:-12}
      CAMOUFOX_PROXY_URL: ${CAMOUFOX_PROXY_URL:-}
      CAMOUFOX_USER_DATA_DIR: ${CAMOUFOX_USER_DATA_DIR:-/home/app/.cache/scout-api/camoufox-profiles/default}
      CAMOUFOX_DISABLE_COOP: ${CAMOUFOX_DISABLE_COOP:-true}
      CAMOUFOX_WARMUP_ORIGIN: ${CAMOUFOX_WARMUP_ORIGIN:-true}
      SHOPEE_WARMUP_POLICY: ${SHOPEE_WARMUP_POLICY:-once_per_session}
      SHOPEE_RESOURCE_BLOCKING_ENABLED: ${SHOPEE_RESOURCE_BLOCKING_ENABLED:-true}
      CAPTCHA_SOLVER_ENABLED: ${CAPTCHA_SOLVER_ENABLED:-true}
      CAPTCHA_SOLVER_PROVIDER: ${CAPTCHA_SOLVER_PROVIDER:-amazoncaptcha}
      CAPTCHA_SOLVER_MAX_ATTEMPTS: ${CAPTCHA_SOLVER_MAX_ATTEMPTS:-2}
      AUTH_BYPASS_ENABLED: ${AUTH_BYPASS_ENABLED:-true}
      AUTH_BYPASS_MAX_ATTEMPTS: ${AUTH_BYPASS_MAX_ATTEMPTS:-2}
      AMAZON_AUTH_EMAIL: ${AMAZON_AUTH_EMAIL:-}
      AMAZON_AUTH_PASSWORD: ${AMAZON_AUTH_PASSWORD:-}
      SHOPEE_AUTH_EMAIL: ${SHOPEE_AUTH_EMAIL:-}
      SHOPEE_AUTH_PASSWORD: ${SHOPEE_AUTH_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Host bind so local headed seed (scripts/seed_camoufox_profile.py) shares
      # cookies/device trust with the Docker Camoufox scraper.
      - ./data/camoufox-profiles:/home/app/.cache/scout-api/camoufox-profiles
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache/coordination only (ADR 0020) — reconstructible, not source of truth.
    command:
      - redis-server
      - --appendonly
      - "no"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scout}
      POSTGRES_DB: ${POSTGRES_DB:-scoutapi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scout} -d ${POSTGRES_DB:-scoutapi}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
