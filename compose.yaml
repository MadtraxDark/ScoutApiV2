services:
  api:
    build:
      context: .
    environment:
      APP_NAME: ${APP_NAME:-ScoutApiV2}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      HOST: 0.0.0.0
      PORT: 8000
      REDIS_URL: redis://redis:6379/0
      CAMOUFOX_ENABLED: ${CAMOUFOX_ENABLED:-true}
      CAMOUFOX_HEADLESS: ${CAMOUFOX_HEADLESS:-true}
      CAMOUFOX_HUMANIZE: ${CAMOUFOX_HUMANIZE:-true}
      CAMOUFOX_TIMEOUT_MS: ${CAMOUFOX_TIMEOUT_MS:-90000}
      CAMOUFOX_SETTLE_MS: ${CAMOUFOX_SETTLE_MS:-5000}
      CAMOUFOX_MAX_SETTLE_ATTEMPTS: ${CAMOUFOX_MAX_SETTLE_ATTEMPTS:-12}
    ports:
      - "${PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
