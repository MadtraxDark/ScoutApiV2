services:
  api:
    build:
      context: .
    environment:
      APP_NAME: ${APP_NAME:-ScoutApiV2}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      # Client auth mandatory by default; false only for local/dev (rejected in production).
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      HOST: 0.0.0.0
      PORT: 8000
      # API auth / CORS (PriceScout SPA). Never use * with credentials.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AUTH_GOOGLE_REDIRECT_URL: ${AUTH_GOOGLE_REDIRECT_URL:-http://localhost:8000/auth/callback}
      AUTH_FRONTEND_SUCCESS_URL: ${AUTH_FRONTEND_SUCCESS_URL:-http://localhost:3000/auth/callback}
      AUTH_ADMIN_USER_IDS: ${AUTH_ADMIN_USER_IDS:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT_PER_MINUTE: ${RATE_LIMIT_DEFAULT_PER_MINUTE:-120}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-20}
      RATE_LIMIT_CRAWLER_PER_MINUTE: ${RATE_LIMIT_CRAWLER_PER_MINUTE:-10}
      RATE_LIMIT_POLL_PER_MINUTE: ${RATE_LIMIT_POLL_PER_MINUTE:-300}
      REDIS_URL: redis://redis:6379/0
      REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-0.3}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-0.5}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://scout:scout@postgres:5432/scoutapi}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-30000}
      DATABASE_APPLICATION_NAME: ${DATABASE_APPLICATION_NAME:-scout-api-v2}
      SCRAPE_URL_COOLDOWN_SECONDS: ${SCRAPE_URL_COOLDOWN_SECONDS:-300}
      SCRAPE_DOMAIN_MIN_INTERVAL_SECONDS: ${SCRAPE_DOMAIN_MIN_INTERVAL_SECONDS:-15}
      SCRAPE_RESULT_CACHE_TTL_SECONDS: ${SCRAPE_RESULT_CACHE_TTL_SECONDS:-300}
      SCRAPE_DISTRIBUTED_LOCK_ENABLED: ${SCRAPE_DISTRIBUTED_LOCK_ENABLED:-true}
      SCRAPE_SINGLE_FLIGHT_LOCK_TTL_SECONDS: ${SCRAPE_SINGLE_FLIGHT_LOCK_TTL_SECONDS:-180}
      SCRAPE_SINGLE_FLIGHT_WAIT_SECONDS: ${SCRAPE_SINGLE_FLIGHT_WAIT_SECONDS:-120}
      SCRAPE_DISTRIBUTED_COOLDOWN_ENABLED: ${SCRAPE_DISTRIBUTED_COOLDOWN_ENABLED:-true}
      CAMOUFOX_ENABLED: ${CAMOUFOX_ENABLED:-true}
      CAMOUFOX_HEADLESS: ${CAMOUFOX_HEADLESS:-true}
      CAMOUFOX_HUMANIZE: ${CAMOUFOX_HUMANIZE:-true}
      CAMOUFOX_TIMEOUT_MS: ${CAMOUFOX_TIMEOUT_MS:-90000}
      CAMOUFOX_LAUNCH_TIMEOUT_MS: ${CAMOUFOX_LAUNCH_TIMEOUT_MS:-45000}
      CAMOUFOX_SETTLE_MS: ${CAMOUFOX_SETTLE_MS:-5000}
      CAMOUFOX_MAX_SETTLE_ATTEMPTS: ${CAMOUFOX_MAX_SETTLE_ATTEMPTS:-12}
      CAMOUFOX_PROXY_URL: ${CAMOUFOX_PROXY_URL:-}
      CAMOUFOX_USER_DATA_DIR: ${CAMOUFOX_USER_DATA_DIR:-/home/app/.cache/scout-api/camoufox-profiles/default}
      CAMOUFOX_DISABLE_COOP: ${CAMOUFOX_DISABLE_COOP:-true}
      CAMOUFOX_WARMUP_ORIGIN: ${CAMOUFOX_WARMUP_ORIGIN:-true}
      CAMOUFOX_CHOWN_PROFILES: ${CAMOUFOX_CHOWN_PROFILES:-off}
      CAMOUFOX_PURGE_DISPOSABLE_CACHE: ${CAMOUFOX_PURGE_DISPOSABLE_CACHE:-true}
      BROWSER_CIRCUIT_FAILURE_THRESHOLD: ${BROWSER_CIRCUIT_FAILURE_THRESHOLD:-1}
      BROWSER_CIRCUIT_COOLDOWN_SECONDS: ${BROWSER_CIRCUIT_COOLDOWN_SECONDS:-60}
      SHOPEE_WARMUP_POLICY: ${SHOPEE_WARMUP_POLICY:-once_per_session}
      SHOPEE_RESOURCE_BLOCKING_ENABLED: ${SHOPEE_RESOURCE_BLOCKING_ENABLED:-true}
      CAPTCHA_SOLVER_ENABLED: ${CAPTCHA_SOLVER_ENABLED:-true}
      CAPTCHA_SOLVER_PROVIDER: ${CAPTCHA_SOLVER_PROVIDER:-amazoncaptcha}
      CAPTCHA_SOLVER_MAX_ATTEMPTS: ${CAPTCHA_SOLVER_MAX_ATTEMPTS:-2}
      AUTH_BYPASS_ENABLED: ${AUTH_BYPASS_ENABLED:-true}
      AUTH_BYPASS_MAX_ATTEMPTS: ${AUTH_BYPASS_MAX_ATTEMPTS:-2}
      AMAZON_AUTH_EMAIL: ${AMAZON_AUTH_EMAIL:-}
      AMAZON_AUTH_PASSWORD: ${AMAZON_AUTH_PASSWORD:-}
      SHOPEE_AUTH_EMAIL: ${SHOPEE_AUTH_EMAIL:-}
      SHOPEE_AUTH_PASSWORD: ${SHOPEE_AUTH_PASSWORD:-}
      # Product images / Google Drive (ADR 0029) — backend-only secrets.
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES:-8000000}
      IMAGE_MAX_DIMENSION: ${IMAGE_MAX_DIMENSION:-4096}
      IMAGE_DOWNLOAD_TIMEOUT_SECONDS: ${IMAGE_DOWNLOAD_TIMEOUT_SECONDS:-30}
      IMAGE_MAX_REDIRECTS: ${IMAGE_MAX_REDIRECTS:-5}
      IMAGE_MAX_PER_PRODUCT: ${IMAGE_MAX_PER_PRODUCT:-20}
      IMAGE_AVIF_QUALITY: ${IMAGE_AVIF_QUALITY:-60}
      IMAGE_AVIF_MAX_CONCURRENCY: ${IMAGE_AVIF_MAX_CONCURRENCY:-2}
      IMAGE_MEDIA_CACHE_MAX_AGE_SECONDS: ${IMAGE_MEDIA_CACHE_MAX_AGE_SECONDS:-86400}
      IMAGE_OPTIMIZATION_ENABLED: ${IMAGE_OPTIMIZATION_ENABLED:-true}
      IMAGE_OPTIMIZATION_SWEEP_INTERVAL_SECONDS: ${IMAGE_OPTIMIZATION_SWEEP_INTERVAL_SECONDS:-2}
      IMAGE_OPTIMIZATION_BATCH_SIZE: ${IMAGE_OPTIMIZATION_BATCH_SIZE:-4}
      IMAGE_OPTIMIZATION_LEASE_SECONDS: ${IMAGE_OPTIMIZATION_LEASE_SECONDS:-300}
      OFFER_REFRESH_INTERVAL_HOURS: ${OFFER_REFRESH_INTERVAL_HOURS:-12}
      OFFER_MONITOR_ENABLED: ${OFFER_MONITOR_ENABLED:-true}
      OFFER_MONITOR_SWEEP_INTERVAL_SECONDS: ${OFFER_MONITOR_SWEEP_INTERVAL_SECONDS:-30}
      OFFER_MONITOR_BATCH_SIZE: ${OFFER_MONITOR_BATCH_SIZE:-10}
      OFFER_MONITOR_LEASE_SECONDS: ${OFFER_MONITOR_LEASE_SECONDS:-300}
      OFFER_MONITOR_RETRY_BASE_SECONDS: ${OFFER_MONITOR_RETRY_BASE_SECONDS:-300}
      OFFER_MONITOR_RETRY_MAX_SECONDS: ${OFFER_MONITOR_RETRY_MAX_SECONDS:-3600}
      OFFER_MONITOR_JITTER_SECONDS: ${OFFER_MONITOR_JITTER_SECONDS:-600}
      OFFER_PROMOTION_GRACE_SECONDS: ${OFFER_PROMOTION_GRACE_SECONDS:-60}
      # Dedicated match-runner owns the queue; keep API in-process scheduler off
      # to avoid dual workers holding row locks / racing claims.
      MATCH_RUN_WORKER_ENABLED: ${API_MATCH_RUN_WORKER_ENABLED:-false}
      MATCH_RUN_SWEEP_INTERVAL_SECONDS: ${MATCH_RUN_SWEEP_INTERVAL_SECONDS:-2}
      MATCH_RUN_BATCH_SIZE: ${MATCH_RUN_BATCH_SIZE:-1}
      MATCH_RUN_LEASE_SECONDS: ${MATCH_RUN_LEASE_SECONDS:-600}
      MATCH_RUN_MAX_ATTEMPTS: ${MATCH_RUN_MAX_ATTEMPTS:-3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Host bind so local headed seed (scripts/seed_camoufox_profile.py) shares
      # cookies/device trust with the Docker Camoufox scraper.
      - ./data/camoufox-profiles:/home/app/.cache/scout-api/camoufox-profiles
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
  image-optimizer:
    build:
      context: .
    command: ["python", "-m", "scout_api.modules.images.worker"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://scout:scout@postgres:5432/scoutapi}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      IMAGE_AVIF_QUALITY: ${IMAGE_AVIF_QUALITY:-60}
      IMAGE_AVIF_MAX_CONCURRENCY: ${IMAGE_AVIF_MAX_CONCURRENCY:-2}
      IMAGE_OPTIMIZATION_ENABLED: ${IMAGE_OPTIMIZATION_ENABLED:-true}
      IMAGE_OPTIMIZATION_SWEEP_INTERVAL_SECONDS: ${IMAGE_OPTIMIZATION_SWEEP_INTERVAL_SECONDS:-2}
      IMAGE_OPTIMIZATION_BATCH_SIZE: ${IMAGE_OPTIMIZATION_BATCH_SIZE:-4}
      IMAGE_OPTIMIZATION_LEASE_SECONDS: ${IMAGE_OPTIMIZATION_LEASE_SECONDS:-300}
      IMAGE_MAX_DIMENSION: ${IMAGE_MAX_DIMENSION:-4096}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  monitor:
    build:
      context: .
    command: ["python", "-m", "scout_api.modules.monitoring.worker"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://scout:scout@postgres:5432/scoutapi}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      REDIS_URL: redis://redis:6379/0
      OFFER_REFRESH_INTERVAL_HOURS: ${OFFER_REFRESH_INTERVAL_HOURS:-12}
      OFFER_MONITOR_ENABLED: ${OFFER_MONITOR_ENABLED:-true}
      OFFER_MONITOR_SWEEP_INTERVAL_SECONDS: ${OFFER_MONITOR_SWEEP_INTERVAL_SECONDS:-30}
      OFFER_MONITOR_BATCH_SIZE: ${OFFER_MONITOR_BATCH_SIZE:-10}
      OFFER_MONITOR_LEASE_SECONDS: ${OFFER_MONITOR_LEASE_SECONDS:-300}
      OFFER_MONITOR_RETRY_BASE_SECONDS: ${OFFER_MONITOR_RETRY_BASE_SECONDS:-300}
      OFFER_MONITOR_RETRY_MAX_SECONDS: ${OFFER_MONITOR_RETRY_MAX_SECONDS:-3600}
      OFFER_MONITOR_JITTER_SECONDS: ${OFFER_MONITOR_JITTER_SECONDS:-600}
      OFFER_PROMOTION_GRACE_SECONDS: ${OFFER_PROMOTION_GRACE_SECONDS:-60}
      CAMOUFOX_ENABLED: ${CAMOUFOX_ENABLED:-true}
      CAMOUFOX_HEADLESS: ${CAMOUFOX_HEADLESS:-true}
      CAMOUFOX_PROXY_URL: ${CAMOUFOX_PROXY_URL:-}
      CAMOUFOX_USER_DATA_DIR: ${CAMOUFOX_USER_DATA_DIR:-/home/app/.cache/scout-api/camoufox-profiles/default}
      CAMOUFOX_LAUNCH_TIMEOUT_MS: ${CAMOUFOX_LAUNCH_TIMEOUT_MS:-45000}
      CAMOUFOX_CHOWN_PROFILES: ${CAMOUFOX_CHOWN_PROFILES:-off}
      CAMOUFOX_PURGE_DISPOSABLE_CACHE: ${CAMOUFOX_PURGE_DISPOSABLE_CACHE:-true}
      BROWSER_CIRCUIT_FAILURE_THRESHOLD: ${BROWSER_CIRCUIT_FAILURE_THRESHOLD:-1}
      BROWSER_CIRCUIT_COOLDOWN_SECONDS: ${BROWSER_CIRCUIT_COOLDOWN_SECONDS:-60}
      SCRAPE_DISTRIBUTED_LOCK_ENABLED: ${SCRAPE_DISTRIBUTED_LOCK_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/camoufox-profiles:/home/app/.cache/scout-api/camoufox-profiles
    restart: unless-stopped
  match-runner:
    build:
      context: .
    command: ["python", "-m", "scout_api.modules.matching.match_run_worker"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://scout:scout@postgres:5432/scoutapi}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      REDIS_URL: redis://redis:6379/0
      MATCH_RUN_WORKER_ENABLED: ${MATCH_RUN_WORKER_ENABLED:-true}
      MATCH_RUN_SWEEP_INTERVAL_SECONDS: ${MATCH_RUN_SWEEP_INTERVAL_SECONDS:-2}
      MATCH_RUN_BATCH_SIZE: ${MATCH_RUN_BATCH_SIZE:-1}
      MATCH_RUN_LEASE_SECONDS: ${MATCH_RUN_LEASE_SECONDS:-600}
      MATCH_RUN_HEARTBEAT_INTERVAL_SECONDS: ${MATCH_RUN_HEARTBEAT_INTERVAL_SECONDS:-120}
      MATCH_RUN_MAX_ATTEMPTS: ${MATCH_RUN_MAX_ATTEMPTS:-3}
      MATCH_STORE_WALL_TIMEOUT_SECONDS: ${MATCH_STORE_WALL_TIMEOUT_SECONDS:-180}
      MATCH_RUN_WALL_TIMEOUT_SECONDS: ${MATCH_RUN_WALL_TIMEOUT_SECONDS:-2700}
      MATCH_RUN_WATCHDOG_STALE_SECONDS: ${MATCH_RUN_WATCHDOG_STALE_SECONDS:-600}
      MATCH_RUN_WATCHDOG_ENABLED: ${MATCH_RUN_WATCHDOG_ENABLED:-true}
      MATCH_RUN_WATCHDOG_CHECK_INTERVAL_SECONDS: ${MATCH_RUN_WATCHDOG_CHECK_INTERVAL_SECONDS:-5}
      MATCH_RUN_TEST_INJECT_HANG: ${MATCH_RUN_TEST_INJECT_HANG:-false}
      CAMOUFOX_ENABLED: ${CAMOUFOX_ENABLED:-true}
      CAMOUFOX_HEADLESS: ${CAMOUFOX_HEADLESS:-true}
      CAMOUFOX_PROXY_URL: ${CAMOUFOX_PROXY_URL:-}
      CAMOUFOX_USER_DATA_DIR: ${CAMOUFOX_USER_DATA_DIR:-/home/app/.cache/scout-api/camoufox-profiles/default}
      CAMOUFOX_LAUNCH_TIMEOUT_MS: ${CAMOUFOX_LAUNCH_TIMEOUT_MS:-45000}
      CAMOUFOX_CHOWN_PROFILES: ${CAMOUFOX_CHOWN_PROFILES:-off}
      CAMOUFOX_PURGE_DISPOSABLE_CACHE: ${CAMOUFOX_PURGE_DISPOSABLE_CACHE:-true}
      BROWSER_CIRCUIT_FAILURE_THRESHOLD: ${BROWSER_CIRCUIT_FAILURE_THRESHOLD:-1}
      BROWSER_CIRCUIT_COOLDOWN_SECONDS: ${BROWSER_CIRCUIT_COOLDOWN_SECONDS:-60}
      SCRAPE_DISTRIBUTED_LOCK_ENABLED: ${SCRAPE_DISTRIBUTED_LOCK_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/camoufox-profiles:/home/app/.cache/scout-api/camoufox-profiles
    # Worker process (no HTTP server) — disable image HEALTHCHECK that probes /health.
    healthcheck:
      disable: true
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache/coordination only (ADR 0020) — reconstructible, not source of truth.
    command:
      - redis-server
      - --appendonly
      - "no"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scout}
      POSTGRES_DB: ${POSTGRES_DB:-scoutapi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scout} -d ${POSTGRES_DB:-scoutapi}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
