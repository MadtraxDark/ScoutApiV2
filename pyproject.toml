[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-api-v2"
version = "0.1.0"
description = "Base arquitetural da API ScoutApiV2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "camoufox[geoip]>=0.4.11,<1.0",
    "cryptography>=49,<51",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pillow>=10.0.0,<12",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "PyJWT[crypto]>=2.8,<3",
    "redis>=5,<7",
    "scrapy>=2.11,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require external services (e.g. Redis)",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["camoufox", "camoufox.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["amazoncaptcha", "amazoncaptcha.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["scout_api"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
