[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-api-v2"
version = "0.1.0"
description = "Base arquitetural da API ScoutApiV2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "camoufox[geoip]>=0.4.11,<1.0",
    "cryptography>=49,<51",
    "curl_cffi>=0.7,<1.0",
    "fastapi>=0.115,<1.0",
    "google-api-python-client>=2.150,<3.0",
    "google-auth>=2.35,<3.0",
    "google-auth-httplib2>=0.2,<1.0",
    "google-auth-oauthlib>=1.2,<2.0",
    "httpx>=0.27,<1.0",
    "pillow>=11.3.0,<13",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "PyJWT[crypto]>=2.8,<3",
    "python-multipart>=0.0.27,<0.1.0",
    "redis>=5,<7",
    "scrapy>=2.11,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
scout-monitor = "scout_api.modules.monitoring.worker:main"
scout-exchange = "scout_api.modules.exchange.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require external services (e.g. Redis, Postgres)",
    "live: tests that hit real storefronts / network (slow, non-deterministic)",
    "slow: intentionally expensive tests (keep out of the default fast loop)",
    "e2e: end-to-end flows spanning multiple layers",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["camoufox", "camoufox.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["curl_cffi", "curl_cffi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["amazoncaptcha", "amazoncaptcha.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "googleapiclient",
    "googleapiclient.*",
    "google.oauth2",
    "google.oauth2.*",
    "google.auth",
    "google.auth.*",
    "google_auth_httplib2",
    "google_auth_httplib2.*",
    "google_auth_oauthlib",
    "google_auth_oauthlib.*",
    "httplib2",
    "httplib2.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["scout_api"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
