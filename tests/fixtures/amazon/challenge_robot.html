<!DOCTYPE html>
<html><head><title>Amazon.com</title></head>
<body>
<form action="/errors/validateCaptcha" method="get">
  <h4>Enter the characters you see below</h4>
  <p>Sorry, we just need to make sure you're not a robot.</p>
  <img src="https://images-na.ssl-images-amazon.com/captcha/sample/Captcha_test.jpg" alt="captcha"/>
  <input type="hidden" name="amzn" value="token"/>
  <input id="captchacharacters" name="field-keywords" type="text"/>
  <button type="submit">Continue shopping</button>
</form>
</body></html>
